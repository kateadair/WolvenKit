name: macOS native build

on:
  push:
    branches:
      - wolvenmac
    paths:
      - "Mac/WolvenKitMac/**"
      - ".github/workflows/macos-native-build.yml"
  pull_request:
    paths:
      - "Mac/WolvenKitMac/**"
      - ".github/workflows/macos-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build native application
        run: swift build --package-path Mac/WolvenKitMac
