name: macOS native build

on:
  push:
    branches:
      - wolvenmac
    paths:
      - "Mac/**"
      - ".github/workflows/macos-native-build.yml"
  pull_request:
    paths:
      - "Mac/**"
      - ".github/workflows/macos-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolvenkit-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the Swift package
        run: swift build --package-path Mac/WolvenKitMac
      - name: Test the Swift package
        run: swift test --package-path Mac/WolvenKitMac
      - name: Build the macOS application bundle
        run: xcodebuild -project Mac/WolvenKitMac.xcodeproj -scheme WolvenKitMac -configuration Release -destination 'generic/platform=macOS' ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
